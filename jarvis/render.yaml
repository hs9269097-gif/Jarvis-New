# ─────────────────────────────────────────────────────────────────────────────
# RENDER BLUEPRINT — JARVIS Command Center
# Push this repo to GitHub, then in Render: New → Blueprint → pick this repo.
# Render will create the web service below automatically.
#
# It runs:  npm install && npm run build  →  npm start
# The Express server binds to Render's $PORT and serves the built client
# (client/dist) plus the /api/* layer from the same origin.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: jarvis
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20

      # Secret used to sign session cookies — Render generates a random value.
      - key: SESSION_SECRET
        generateValue: true

      # Require login before using the command center (default: off).
      - key: AUTH_REQUIRED
        value: "false"
        sync: false

      # ── AI providers — fill these in Render dashboard (Environment tab). ──
      # Secrets stay on the server; they are NEVER bundled into the client.
      # Demo Mode works with none of these set.
      - key: AI_PROVIDER
        value: anthropic     # demo | openai | anthropic | gemini | local
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        value: claude-opus-5
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOCAL_AI_BASE_URL
        sync: false
      - key: LOCAL_AI_MODEL
        sync: false

      # ── Web search (optional) — brave | tavily | serpapi ──
      - key: SEARCH_PROVIDER
        sync: false
      - key: SEARCH_API_KEY
        sync: false
